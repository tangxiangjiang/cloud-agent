# Copy to config.yaml (gitignored). Do not put API keys in this file.
# API key is read from the environment variable named by apiKeyEnv.

gatewayUrl: ws://127.0.0.1:8080/v1/slave/ws
slaveId: slave_devpc
name: 台式机

# Whitelist projects. cwd = absolute path; index = milestone JSON relative to cwd.
projects:
  - id: r_cloud_agent
    name: cloud-agent
    cwd: E:/workspace/cloud-agent
    index: ai/milestones.json

# Name of the env var that holds the Cursor API key (not the key itself).
apiKeyEnv: CURSOR_API_KEY

# Default model when task.model is omitted (Local Agent requires a model).
defaultModel: composer-2.5

# Env var name for Gateway Bearer (from POST /v1/auth/pair). Required to run.
tokenEnv: GATEWAY_TOKEN

# Optional AI summary on project.sync (Local Agent, read-only, short timeout).
# Default true when CURSOR_API_KEY is set and not --stub.
# Disable: syncAiSummary: false  OR  env SYNC_AI_SUMMARY=0
# syncAiSummary: true

# Copy to config.yaml (gitignored). Do not put API keys in this file.
# API key is read from the environment variable named by apiKeyEnv.

gatewayUrl: ws://127.0.0.1:8080/v1/slave/ws
slaveId: slave_devpc
name: 台式机

# Exactly one project per Slave process (M11). For multiple projects use
# master.config.yaml + `npm run master`. Escape hatch: --legacy-multi-project.
# cwd = absolute path; index = milestone JSON relative to cwd.
projects:
  - id: r_cloud_agent
    name: cloud-agent
    cwd: E:/workspace/cloud-agent
    index: ai/milestones.json

# Name of the env var that holds the Cursor API key (not the key itself).
apiKeyEnv: CURSOR_API_KEY

# Default model when task.model is omitted.
# Pro personal: Cursor.models.list often only has `default` (use that).
# Teams/Enterprise with Router: can use auto-smart.
defaultModel: default

# App/Gateway "auto" preference (catalog may override if preferred id missing).
# Pro → default; Teams Router → auto-smart.
autoModelId: default

# Only applied when resolved model is auto-smart: cost | balanced | intelligence
optimizeFor: cost

# Env var name for Gateway Bearer (from POST /v1/auth/pair). Required to run.
tokenEnv: GATEWAY_TOKEN

# Optional AI summary on project.sync (Local Agent, read-only, short timeout).
# Default true when CURSOR_API_KEY is set and not --stub.
# Disable: syncAiSummary: false  OR  env SYNC_AI_SUMMARY=0
# syncAiSummary: true
